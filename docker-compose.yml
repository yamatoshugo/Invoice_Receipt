# ローカルで動作確認するためのPostgres。
# 本番は Neon を使うのでこのファイルはデプロイには関係しない。
#
#   docker compose up -d     起動
#   docker compose down      停止（データは残る）
#   docker compose down -v   停止してデータも消す
services:
  db:
    image: postgres:17-alpine
    container_name: invoice_receipt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice
      # 日本語データを扱うため初期化時のロケールを明示する
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # 既存のPostgres(5432)と衝突しないようホスト側は55432を使う
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
